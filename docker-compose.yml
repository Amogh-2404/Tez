services:
  tez:
    build: .
    image: tez:local
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./static:/app/static:ro
    restart: unless-stopped
    stop_grace_period: 10s
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 2.0
    command:
      - --address
      - 0.0.0.0
      - --config
      - /app/config.json
      - --static-dir
      - /app/static
      - --threads
      - "2"
      - --max-connections
      - "32"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
