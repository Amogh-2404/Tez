<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
<title id="title">A small server with explicit boundaries</title><desc id="desc">Async sessions route to immutable configuration or a confined file reader and validated file cache.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52615a"/></marker></defs>
<rect width="1100" height="540" fill="#f7f6f1"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="40" y="44" font-size="13" fill="#52615a" font-weight="700">TEZ / ARCHITECTURE</text>
<text x="40" y="86" font-size="30" fill="#1b211e" font-weight="700">A small server with explicit boundaries</text>
<path d="M40 108 H1060" stroke="#cbd1c9"/>
<rect x="40" y="155" width="175" height="120" fill="#ffffff" stroke="#cbd1c9" stroke-width="1.5"/>
<text x="58" y="187" font-size="20" fill="#1b211e" font-weight="700">Client</text>
<text x="58" y="214" font-size="16" fill="#52615a" font-weight="400">HTTP/1.x</text>
<text x="58" y="238" font-size="16" fill="#52615a" font-weight="400">TCP connection</text>
<rect x="260" y="155" width="260" height="120" fill="#ffffff" stroke="#c47f19" stroke-width="1.5"/>
<text x="278" y="187" font-size="20" fill="#1b211e" font-weight="700">Listener + session</text>
<text x="278" y="214" font-size="16" fill="#52615a" font-weight="400">Asio accept / read / write</text>
<text x="278" y="238" font-size="16" fill="#52615a" font-weight="400">Beast parser + serializer</text>
<rect x="610" y="145" width="440" height="92" fill="#ffffff" stroke="#cbd1c9" stroke-width="1.5"/>
<text x="628" y="177" font-size="20" fill="#1b211e" font-weight="700">Built-ins + configured routes</text>
<text x="628" y="204" font-size="16" fill="#52615a" font-weight="400">Method dispatch; immutable startup snapshot</text>
<rect x="610" y="275" width="440" height="92" fill="#ffffff" stroke="#cbd1c9" stroke-width="1.5"/>
<text x="628" y="307" font-size="20" fill="#1b211e" font-weight="700">Static file reader</text>
<text x="628" y="334" font-size="16" fill="#52615a" font-weight="400">Descriptor-relative opens; size checks</text>
<rect x="610" y="405" width="440" height="78" fill="#ffffff" stroke="#cbd1c9" stroke-width="1.5"/>
<text x="628" y="437" font-size="20" fill="#1b211e" font-weight="700">File cache</text>
<text x="628" y="464" font-size="16" fill="#52615a" font-weight="400">Metadata checked before every hit</text>
<path d="M215 215 L260 215" fill="none" stroke="#52615a" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M520 197 H565 V191 H610" fill="none" stroke="#52615a" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M520 244 H565 V321 H610" fill="none" stroke="#52615a" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M830 367 L830 405" fill="none" stroke="#52615a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="260" y="328" font-size="19" fill="#1b211e" font-weight="700">One retained input buffer</text>
<text x="260" y="357" font-size="19" fill="#1b211e" font-weight="700">One ordered response stream</text>
<text x="260" y="397" font-size="17" fill="#52615a" font-weight="400">Deadlines + admission limit</text>
<text x="40" y="514" font-size="15" fill="#52615a" font-weight="400">Socket I/O is asynchronous. Route work, file reads, and logging execute synchronously in handlers.</text>
</g></svg>
