<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="555" viewBox="0 0 1100 555" role="img" aria-labelledby="title desc">
<title id="title">Workers run handlers; sessions own state</title><desc id="desc">Multiple I/O threads execute one io_context; each session&#x27;s strand serializes callbacks.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52615a"/></marker></defs>
<rect width="1100" height="555" fill="#f7f6f1"/>
<g font-family="Helvetica,Arial,sans-serif">
<text x="40" y="44" font-size="13" fill="#52615a" font-weight="700">TEZ / ARCHITECTURE</text>
<text x="40" y="86" font-size="30" fill="#1b211e" font-weight="700">Workers run handlers; sessions own state</text>
<path d="M40 108 H1060" stroke="#cbd1c9"/>
<rect x="40" y="145" width="310" height="85" fill="#ffffff" stroke="#cbd1c9" stroke-width="1.5"/>
<text x="58" y="177" font-size="20" fill="#1b211e" font-weight="700">I/O worker 1</text>
<text x="58" y="204" font-size="16" fill="#52615a" font-weight="400">io_context::run()</text>
<rect x="395" y="145" width="310" height="85" fill="#ffffff" stroke="#cbd1c9" stroke-width="1.5"/>
<text x="413" y="177" font-size="20" fill="#1b211e" font-weight="700">I/O worker 2</text>
<text x="413" y="204" font-size="16" fill="#52615a" font-weight="400">io_context::run()</text>
<rect x="750" y="145" width="310" height="85" fill="#ffffff" stroke="#cbd1c9" stroke-width="1.5"/>
<text x="768" y="177" font-size="20" fill="#1b211e" font-weight="700">I/O worker 3</text>
<text x="768" y="204" font-size="16" fill="#52615a" font-weight="400">io_context::run()</text>
<path d="M195 230 V269 H905 V230 M550 230 V269 M550 269 V308" fill="none" stroke="#52615a" stroke-width="1.5"/>
<rect x="40" y="308" width="310" height="116" fill="#ffffff" stroke="#c47f19" stroke-width="1.5"/>
<text x="58" y="340" font-size="20" fill="#1b211e" font-weight="700">Session A / strand</text>
<text x="58" y="367" font-size="16" fill="#52615a" font-weight="400">Read → handle → write</text>
<text x="58" y="391" font-size="16" fill="#52615a" font-weight="400">Serialized for this connection</text>
<rect x="395" y="308" width="310" height="116" fill="#ffffff" stroke="#c47f19" stroke-width="1.5"/>
<text x="413" y="340" font-size="20" fill="#1b211e" font-weight="700">Session B / strand</text>
<text x="413" y="367" font-size="16" fill="#52615a" font-weight="400">Read → handle → write</text>
<text x="413" y="391" font-size="16" fill="#52615a" font-weight="400">May run beside another session</text>
<rect x="750" y="308" width="310" height="116" fill="#ffffff" stroke="#c47f19" stroke-width="1.5"/>
<text x="768" y="340" font-size="20" fill="#1b211e" font-weight="700">Session C / strand</text>
<text x="768" y="367" font-size="16" fill="#52615a" font-weight="400">Read → handle → write</text>
<text x="768" y="391" font-size="16" fill="#52615a" font-weight="400">No fixed worker assignment</text>
<path d="M195 269 V308 M905 269 V308" stroke="#52615a" stroke-width="1.5"/>
<text x="40" y="478" font-size="18" fill="#1b211e" font-weight="700">File reads, JSON work, cache locks, and stderr writes can occupy a worker.</text>
<text x="40" y="529" font-size="15" fill="#52615a" font-weight="400">A strand orders handlers. It does not create a thread or make synchronous operations nonblocking.</text>
</g></svg>
